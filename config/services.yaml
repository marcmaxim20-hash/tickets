# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json
parameters:
    default_admin_username: 'admin@swiftdesk.local'
    default_admin_password: '1234'
    default_organizer_registration_code: '1111'
    default_nvidia_api_key: ''
    default_nvidia_ai_model: 'moonshotai/kimi-k3.1-pro'

services:
    _defaults:
        autowire: true
        autoconfigure: true
        bind:
            string $adminUsername: '%env(default:default_admin_username:ADMIN_USERNAME)%'
            string $adminPassword: '%env(default:default_admin_password:ADMIN_PASSWORD)%'
            string $adminAccessCode: '%env(ADMIN_ACCESS_CODE)%'
            string $organizerRegistrationCode: '%env(default:default_organizer_registration_code:ORGANIZER_REGISTRATION_CODE)%'
            string $smtpHost: '%env(SMTP_HOST)%'
            string $smtpPort: '%env(SMTP_PORT)%'
            string $smtpUser: '%env(SMTP_USER)%'
            string $smtpPassword: '%env(SMTP_PASSWORD)%'
            string $smtpFrom: '%env(SMTP_FROM)%'
            string $mailerDsn: '%env(MAILER_DSN)%'
            string $showEntryCode: '%env(SHOW_ENTRY_CODE)%'
            string $nvidiaApiKey: '%env(default:default_nvidia_api_key:NVIDIA_API_KEY)%'
            string $nvidiaAiModel: '%env(default:default_nvidia_ai_model:NVIDIA_AI_MODEL)%'

    App\:
        resource: '../src/'
